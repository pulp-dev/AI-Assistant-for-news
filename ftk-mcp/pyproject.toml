[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ftk-mcp"
version = "0.1.0"
description = "Read-only MCP server for the public catalog at f-tk.ru"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "pulp-dev"}]
dependencies = [
  "mcp>=2.0,<3",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.12,<5",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.9,<1"]

[project.scripts]
ftk-mcp = "ftk_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ftk_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
