name: MOEX full bond market

on:
  workflow_dispatch:
  schedule:
    # Main MOEX bond boards, refreshed every 30 minutes on weekdays.
    - cron: "*/30 06-18 * * 1-5"
  push:
    paths:
      - "moex-bridge/fetch_market.py"
      - "moex-bridge/screen_fixed.py"
      - "moex-bridge/shortlist_fixed.py"
      - ".github/workflows/moex-market.yml"

permissions:
  contents: write

concurrency:
  group: moex-full-market
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch full MOEX bond market
        run: python3 moex-bridge/fetch_market.py
      - name: Screen fixed-coupon candidates
        run: python3 moex-bridge/screen_fixed.py
      - name: Build practical fixed shortlist
        run: python3 moex-bridge/shortlist_fixed.py
      - name: Commit market snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moex-bridge/data/market.jsonl moex-bridge/data/market_index.json moex-bridge/data/market_meta.json moex-bridge/data/fixed_screen.json moex-bridge/data/fixed_shortlist.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update full MOEX bond market"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
