name: MOEX detailed bond snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 06-18 * * 1-5"
  push:
    paths:
      - "moex-bridge/fetch_moex.py"
      - "moex-bridge/fetch_moex_parallel.py"
      - "moex-bridge/watchlist.json"
      - "moex-bridge/summarize_detailed.py"
      - "moex-bridge/build_floater_report.py"
      - "moex-bridge/list_target_offers.py"
      - "moex-bridge/floater_targets.json"
      - ".github/workflows/moex-bridge.yml"

permissions:
  contents: write

concurrency:
  group: moex-detailed-snapshot
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch detailed MOEX ISS data
        run: python3 moex-bridge/fetch_moex_parallel.py
      - name: Build compact detailed summary
        run: python3 moex-bridge/summarize_detailed.py
      - name: Build floater horizon report
        run: python3 moex-bridge/build_floater_report.py
      - name: Audit target offers
        run: python3 moex-bridge/list_target_offers.py
      - name: Commit detailed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moex-bridge/data/latest.json moex-bridge/data/detailed_summary.tsv moex-bridge/data/floater_report.json moex-bridge/data/floater_report.tsv moex-bridge/data/floater_offers.tsv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update detailed MOEX bond snapshot"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
