name: MOEX fixed bonds 2027-2028 full screen

on:
  workflow_dispatch:
  push:
    paths:
      - "moex-bridge/screen_fixed_2027_2028.py"
      - "moex-bridge/retry_fixed_2027_2028.py"
      - ".github/workflows/moex-fixed-2027-2028.yml"

permissions:
  contents: write

concurrency:
  group: moex-fixed-2027-2028
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run full fixed screen
        run: python3 moex-bridge/screen_fixed_2027_2028.py
      - name: Retry transient MOEX errors
        run: python3 moex-bridge/retry_fixed_2027_2028.py
      - name: Commit screen results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moex-bridge/data/fixed_2027_2028.json moex-bridge/data/fixed_2027_2028.tsv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update full fixed bond 2027-2028 screen"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
